<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rubius Poke Catch</title>

<script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:"Press Start 2P",monospace;
}


/* =========================================================
   APP
========================================================= */

#app{

    position:relative;

    width:500px;
    height:800px;

    overflow:hidden;

    background:#f4f4f1;

    color:#222;

    border:4px solid #222;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:86px;

    background:#ef5350;

    border-bottom:4px solid #222;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    z-index:30;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    position:relative;

    width:250px;
    height:78px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

}


/* =========================================================
   LOGO IMAGE
========================================================= */

.logo img{

    display:block;

    width:240px;
    height:74px;

    max-width:240px;
    max-height:74px;

    object-fit:contain;

    object-position:center;

}


/* =========================================================
   TWITCH STATUS
========================================================= */

.status{

    position:absolute;

    top:96px;
    left:18px;

    font-size:8px;

    color:#555;

    z-index:25;

}

.status::before{

    content:"";

    display:inline-block;

    width:7px;
    height:7px;

    margin-right:6px;

    border-radius:50%;

    background:#aaa;

}

.status.connected{

    color:#333;

}

.status.connected::before{

    background:#42d77d;

}


/* =========================================================
   POKEMON CARD
========================================================= */

.pokemon-card{

    position:absolute;

    left:15px;
    right:15px;

    top:116px;

    height:360px;

    background-image:url("./background.png");

    background-size:cover;

    background-position:center;

    border:4px solid #222;

    border-radius:8px;

    overflow:hidden;

    z-index:5;

}


/* =========================================================
   BACKGROUND OVERLAY
========================================================= */

.pokemon-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.12)
        );

    pointer-events:none;

    z-index:1;

}


/* =========================================================
   TIMER
========================================================= */

.timer{

    position:absolute;

    top:12px;
    right:12px;

    min-width:66px;

    padding:8px 9px;

    background:#222;

    color:#fff;

    text-align:center;

    font-size:10px;

    z-index:15;

}

.timer.warning{

    background:#ef5350;

    animation:
        timerBlink .5s steps(2) infinite;

}

@keyframes timerBlink{

    0%{
        opacity:1;
    }

    100%{
        opacity:.55;
    }

}


/* =========================================================
   POKEMON STAGE
========================================================= */

.pokemon-stage{

    position:absolute;

    left:0;
    right:0;

    top:18px;

    height:238px;

    display:flex;

    justify-content:center;
    align-items:center;

    z-index:3;

}


/* =========================================================
   POKEMON SHADOW
========================================================= */

.pokemon-stage::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:8px;

    transform:translateX(-50%);

    width:180px;
    height:22px;

    border-radius:50%;

    background:rgba(0,0,0,.18);

    filter:blur(4px);

    z-index:0;

}


/* =========================================================
   POKEMON SPRITE
========================================================= */

#pokemonSprite{

    position:relative;

    display:block;

    width:220px;
    height:220px;

    max-width:220px;
    max-height:220px;

    object-fit:contain;

    z-index:3;

    transition:
        transform .2s ease,
        opacity .2s ease;

}


/* =========================================================
   HIT
========================================================= */

#pokemonSprite.hit{

    animation:
        hit .25s steps(4);

}

@keyframes hit{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-10px);
    }

    50%{
        transform:translateX(10px);
    }

    75%{
        transform:translateX(-7px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =========================================================
   CAPTURE
========================================================= */

#pokemonSprite.captured{

    animation:
        captured .7s steps(5) forwards;

}

@keyframes captured{

    0%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(.12);
        opacity:0;
    }

}


/* =========================================================
   ESCAPE
========================================================= */

#pokemonSprite.escape{

    animation:
        escape .7s steps(5) forwards;

}

@keyframes escape{

    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(-110px);
        opacity:0;
    }

}


/* =========================================================
   POKEMON NAME
========================================================= */

.pokemon-name{

    position:absolute;

    left:20px;
    right:20px;

    bottom:73px;

    text-align:center;

    font-size:17px;

    color:#fff;

    text-shadow:
        2px 2px 0 #222,
        -1px -1px 0 #222;

    text-transform:uppercase;

    z-index:10;

}


/* =========================================================
   HP
========================================================= */

.hp-area{

    position:absolute;

    left:25px;
    right:25px;

    bottom:17px;

    z-index:10;

}

.hp-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:7px;

}

.hp-label{

    font-size:9px;

    color:#fff;

    text-shadow:
        2px 2px 0 #222;

}

.hp-text{

    font-size:8px;

    color:#fff;

    text-shadow:
        2px 2px 0 #222;

}

.hp-bar{

    width:100%;

    height:17px;

    background:#ddd;

    border:3px solid #222;

}

.hp-fill{

    width:100%;

    height:100%;

    background:#55cf72;

    transition:
        width .25s ease,
        background .25s ease;

}


/* =========================================================
   CAPTURE PANEL
========================================================= */

.capture-panel{

    position:absolute;

    left:15px;
    right:15px;

    top:489px;

    height:92px;

    padding:12px 15px;

    background:#fff;

    border:4px solid #222;

    border-radius:8px;

    z-index:10;

}

.capture-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:8px;

}

.capture-title{

    font-size:9px;

}

.capture-percent{

    font-size:15px;

    color:#ef5350;

}

.capture-bar{

    width:100%;

    height:15px;

    background:#e5e5e5;

    border:3px solid #222;

}

.capture-fill{

    width:0%;

    height:100%;

    background:#55cf72;

    transition:
        width .25s ease;

}

.capture-info{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    font-size:7px;

    color:#777;

}


/* =========================================================
   COMMANDS
========================================================= */

.commands{

    position:absolute;

    left:15px;
    right:15px;

    top:593px;

    height:57px;

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:8px;

    z-index:10;

}

.command{

    border:4px solid #222;

    border-radius:7px;

    font-family:"Press Start 2P",monospace;

    font-size:9px;

    color:#fff;

    cursor:default;

    transition:
        transform .1s,
        filter .1s;

}

.command.fight{

    background:#ef5350;

}

.command.catch{

    background:#3f8ee8;

}

.command.item{

    background:#f2bd3d;

    color:#222;

}

.command.active{

    transform:translateY(3px);

    filter:brightness(1.2);

}


/* =========================================================
   BOTTOM
========================================================= */

.bottom{

    position:absolute;

    left:15px;
    right:15px;

    top:665px;

    height:120px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    z-index:10;

}


/* =========================================================
   PANELS
========================================================= */

.chat-panel,
.ranking-panel{

    background:#fff;

    border:4px solid #222;

    border-radius:8px;

    overflow:hidden;

}

.panel-title{

    height:27px;

    display:flex;

    align-items:center;

    padding-left:9px;

    background:#222;

    color:#fff;

    font-size:7px;

}


/* =========================================================
   CHAT
========================================================= */

.chat-list{

    padding:7px 8px;

}

.chat-message{

    margin-bottom:7px;

    font-size:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.chat-user{

    color:#ef5350;

}

.chat-command{

    color:#333;

}


/* =========================================================
   RANKING
========================================================= */

.ranking-list{

    padding:5px 8px;

}

.rank-row{

    display:grid;

    grid-template-columns:
        20px 1fr 25px;

    align-items:center;

    height:18px;

    font-size:6px;

    border-bottom:
        1px solid #eee;

}

.rank-number{

    color:#ef5350;

}

.rank-count{

    text-align:right;

    color:#555;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    position:absolute;

    left:50%;

    top:340px;

    width:85%;

    padding:10px;

    transform:
        translate(-50%,10px);

    background:#222;

    color:#fff;

    border-radius:6px;

    text-align:center;

    font-size:8px;

    line-height:1.7;

    opacity:0;

    pointer-events:none;

    z-index:50;

    transition:
        opacity .15s,
        transform .15s;

}

.message.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   POKEBALL
========================================================= */

.pokeball{

    position:absolute;

    left:50%;
    top:280px;

    width:54px;
    height:54px;

    border-radius:50%;

    border:4px solid #222;

    background:
        linear-gradient(
            #ef5350 0 46%,
            #222 46% 54%,
            #fff 54% 100%
        );

    transform:
        translate(-50%,-50%)
        scale(0);

    z-index:60;

}

.pokeball::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:15px;
    height:15px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    border:3px solid #222;

}

.pokeball.throw{

    animation:
        ballThrow .8s steps(5) forwards;

}

@keyframes ballThrow{

    0%{

        transform:
            translate(-50%,80px)
            scale(.4)
            rotate(0deg);

    }

    100%{

        transform:
            translate(-50%,-10px)
            scale(1)
            rotate(360deg);

    }

}


/* =========================================================
   FLASH
========================================================= */

.capture-flash{

    position:absolute;

    inset:0;

    background:#fff;

    opacity:0;

    pointer-events:none;

    z-index:100;

}

.capture-flash.active{

    animation:
        flash .35s steps(3);

}

@keyframes flash{

    0%{
        opacity:0;
    }

    30%{
        opacity:.75;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   ITEM EFFECT
========================================================= */

.item-effect{

    position:absolute;

    left:50%;
    top:280px;

    transform:
        translate(-50%,-50%)
        scale(0);

    color:#f2bd3d;

    font-size:12px;

    z-index:55;

    pointer-events:none;

}

.item-effect.active{

    animation:
        itemPop .7s steps(4);

}

@keyframes itemPop{

    0%{

        transform:
            translate(-50%,-50%)
            scale(0);

        opacity:0;

    }

    35%{

        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;

    }

    100%{

        transform:
            translate(-50%,-90%)
            scale(1);

        opacity:0;

    }

}

</style>

</head>


<body>

<div id="app">


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <img
                src="./Rubius-Catch.png"
                alt="Rubius Poke Catch"
            >

        </div>

    </header>


    <!-- TWITCH STATUS -->

    <div
        id="connectionStatus"
        class="status"
    >
        CONECTANDO TWITCH...
    </div>


    <!-- POKEMON -->

    <section
        id="pokemonCard"
        class="pokemon-card"
    >

        <div
            id="timer"
            class="timer"
        >
            20.0s
        </div>


        <div class="pokemon-stage">

            <img
                id="pokemonSprite"
                src=""
                alt="Pokemon"
            >

        </div>


        <div
            id="pokemonName"
            class="pokemon-name"
        >
            CARGANDO...
        </div>


        <div class="hp-area">

            <div class="hp-top">

                <span class="hp-label">
                    HP
                </span>

                <span
                    id="hpText"

    <!-- CAPTURE -->

    <section class="capture-panel">

        <div class="capture-top">

        </div>


        <div class="capture-info">

            <span>
                BASE
                <b id="baseChance">
                    15%
                </b>
            </span>

            <span>

                <b id="damageBonus">
                    +0%
                </b>
            </span>

            <span>
                ITEM
                <b id="itemBonus">
                    +0%
                </b>
            </span>

        </div>

    </section>


    <!-- COMMANDS -->

    <section class="commands">

        <button
            id="fightButton"

        <button

    <!-- CHAT + RANKING -->

    <section class="bottom">

        <div class="chat-panel">

            <div class="panel-title">
                RECENT CHAT
            </div>

            <div
                id="chatList"

        <div class="ranking-panel">

                id="rankingList"

    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- FLASH -->

    <div
        id="captureFlash"
        class="capture-flash"
    ></div>


    <!-- POKEBALL -->

    <div
        id="pokeball"
        class="pokeball"
    ></div>


    <!-- ITEM -->

    <div
        id="itemEffect"
        class="item-effect"
    >
        +CAPTURE
    </div>


</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const CHANNEL =
    (
        params.get("channel")
        ||
        "rubius"
    )
    .toLowerCase()
    .trim();

const POKEMON_MAX =
    1025;

const ROUND_TIME =
    20;

const FIGHT_DAMAGE_MIN =
    8;

const FIGHT_DAMAGE_MAX =
    17;

const POKEAPI =
    "https://pokeapi.co/api/v2/pokemon/";


/* =========================================================
   STATE
========================================================= */

let currentPokemon =
    null;

let currentHP =
    100;

let currentMaxHP =
    100;

let timeLeft =
    ROUND_TIME;

let timerInterval =
    null;

let roundActive =
    false;

let itemBonus =
    0;

let itemUsed =
    false;

let processingCatch =
    false;

let captures =
    {};

let recentPokemon =
    [];


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const pokemonSprite =
    document.getElementById(
        "pokemonSprite"
    );

const pokemonName =
    document.getElementById(
        "pokemonName"
    );

const hpFill =
    document.getElementById(
        "hpFill"
    );

const hpText =
    document.getElementById(
        "hpText"
    );

const timer =
    document.getElementById(
        "timer"
    );

const capturePercent =
    document.getElementById(
        "capturePercent"
    );

const captureFill =
    document.getElementById(
        "captureFill"
    );

const baseChance =
    document.getElementById(
        "baseChance"
    );

const damageBonus =
    document.getElementById(
        "damageBonus"
    );

const itemBonusElement =
    document.getElementById(
        "itemBonus"
    );

const chatList =
    document.getElementById(
        "chatList"
    );

const rankingList =
    document.getElementById(
        "rankingList"
    );

const message =
    document.getElementById(
        "message"
    );

const captureFlash =
    document.getElementById(
        "captureFlash"
    );

const pokeball =
    document.getElementById(
        "pokeball"
    );

const itemEffect =
    document.getElementById(
        "itemEffect"
    );


/* =========================================================
   RANDOM
========================================================= */

function randomInt(
    min,
    max
){

    return Math.floor(
        Math.random() *
        (
            max - min + 1
        )
    ) + min;

}


function randomPokemonId(){

    let id;

    do{

        id =
            randomInt(
                1,
                POKEMON_MAX
            );

    }while(
        recentPokemon.includes(id)
        &&
        recentPokemon.length <
        POKEMON_MAX
    );

    recentPokemon.push(
        id
    );

    if(
        recentPokemon.length >
        20
    ){

        recentPokemon.shift();

    }

    return id;

}


/* =========================================================
   TEXT
========================================================= */

function capitalize(
    text
){

    if(
        !text
    ){

        return "";

    }

    return (
        text.charAt(0).toUpperCase()
        +
        text.slice(1)
    );

}


function formatPokemonName(
    name
){

    return name
        .split("-")
        .map(capitalize)
        .join(" ");

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;

function showMessage(
    text
){

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

    clearTimeout(
        messageTimeout
    );

    messageTimeout =
        setTimeout(
            ()=>{

                message.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   CHAT
========================================================= */

function addChat(
    username,
    text
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "chat-message";

    const user =
        document.createElement(
            "span"
        );

    user.className =
        "chat-user";

    user.textContent =
        username + ":";

    const msg =
        document.createElement(
            "span"
        );

    if(
        text.trim().startsWith("!")
    ){

        msg.className =
            "chat-command";

    }

    msg.textContent =
        " " + text;

    row.appendChild(
        user
    );

    row.appendChild(
        msg
    );

    chatList.prepend(
        row
    );

    while(
        chatList.children.length >
        6
    ){

        chatList.removeChild(
            chatList.lastChild
        );

    }

}


/* =========================================================
   RANKING
========================================================= */

function addCapture(
    username
){

    if(
        !captures[username]
    ){

        captures[username] =
            0;

    }

    captures[username]++;

    updateRanking();

}


function updateRanking(){

    const entries =
        Object.entries(
            captures
        )
        .sort(
            (a,b)=>
                b[1] - a[1]
        )
        .slice(
            0,
            6
        );

    rankingList.innerHTML =
        "";

    if(
        entries.length === 0
    ){

        rankingList.innerHTML = `
            <div style="
                padding:8px;
                font-size:6px;
                line-height:1.8;
                color:#777;
            ">
                NO CAPTURES YET
            </div>
        `;

        return;

    }

    entries.forEach(
        (
            [username,count],
            index
        )=>{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "rank-row";

            row.innerHTML = `

                <span class="rank-number">
                    ${index + 1}
                </span>

                <span>
                    ${escapeHTML(username)}
                </span>

                <span class="rank-count">
                    ${count}
                </span>

            `;

            rankingList.appendChild(
                row
            );

        }
    );

}


function escapeHTML(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   NEW POKEMON
========================================================= */

async function newPokemon(){

    clearInterval(
        timerInterval
    );

    roundActive =
        false;

    processingCatch =
        false;

    itemBonus =
        0;

    itemUsed =
        false;

    timeLeft =
        ROUND_TIME;

    pokemonSprite.className =
        "";

    const id =
        randomPokemonId();

    pokemonName.textContent =
        "CARGANDO...";

    pokemonSprite.src =
        "";

    try{

        const response =
            await fetch(
                POKEAPI + id
            );

        const data =
            await response.json();

        currentPokemon =
            data;

        currentMaxHP =
            100;

        currentHP =
            100;

        pokemonName.textContent =
            formatPokemonName(
                data.name
            );

        pokemonSprite.src =
            data
                .sprites
                .other
                ?.["official-artwork"]
                ?.front_default
            ||
            data
                .sprites
                .front_default
            ||
            "";

        updateHP();

        updateCapture();

        roundActive =
            true;

        startTimer();

        showMessage(
            `WILD ${formatPokemonName(
                data.name
            )} APPEARED!`
        );

    }
    catch(error){

        console.error(
            "Pokemon error:",
            error
        );

        pokemonName.textContent =
            "ERROR";

        setTimeout(
            newPokemon,
            2000
        );

    }

}


/* =========================================================
   HP
========================================================= */

function updateHP(){

    const percentage =
        Math.max(
            0,
            currentHP /
            currentMaxHP *
            100
        );

    hpFill.style.width =
        percentage + "%";

    hpText.textContent =
        `${Math.round(
            currentHP
        )} / ${currentMaxHP}`;

    if(
        percentage > 55
    ){

        hpFill.style.background =
            "#55cf72";

    }
    else if(
        percentage > 25
    ){

        hpFill.style.background =
            "#f2bd3d";

    }
    else{

        hpFill.style.background =
            "#ef5350";

    }

    updateCapture();

}


/* =========================================================
   CAPTURE CHANCE
========================================================= */

function getBaseChance(){

    return 15;

}


function getCaptureChance(){

    const base =
        getBaseChance();

    const damage =
        (
            (100 - currentHP)
            /
            100
        )
        *
        65;

    const chance =
        base +
        damage +
        itemBonus;

    return Math.min(
        95,
        Math.max(
            1,
            chance
        )
    );

}


function updateCapture(){

    const base =
        getBaseChance();

    const damage =
        (
            (100 - currentHP)
            /
            100
        )
        *
        65;

    const chance =
        getCaptureChance();

    capturePercent.textContent =
        `${Math.round(
            chance
        )}%`;

    captureFill.style.width =
        chance + "%";

    baseChance.textContent =
        `${base}%`;

    damageBonus.textContent =
        `+${Math.round(
            damage
        )}%`;

    itemBonusElement.textContent =
        `+${itemBonus}%`;

}


/* =========================================================
   FIGHT
========================================================= */

function fight(
    username
){

    if(
        !roundActive
    ){

        return;

    }

    highlight(
        "fightButton"
    );

    const damage =
        randomInt(
            FIGHT_DAMAGE_MIN,
            FIGHT_DAMAGE_MAX
        );

    currentHP =
        Math.max(
            0,
            currentHP - damage
        );

    pokemonSprite.classList.remove(
        "hit"
    );

    void pokemonSprite.offsetWidth;

    pokemonSprite.classList.add(
        "hit"
    );

    updateHP();

    showMessage(
        `${username} DEALT ${damage} DAMAGE`
    );

    if(
        currentHP <= 0
    ){

        currentHP =
            1;

        updateHP();

    }

}


/* =========================================================
   ITEM
========================================================= */

function useItem(
    username
){

    if(
        !roundActive
    ){

        return;

    }

    if(
        itemUsed
    ){

        showMessage(
            "ITEM ALREADY USED"
        );

        return;

    }

    itemUsed =
        true;

    itemBonus =
        20;

    highlight(
        "itemButton"
    );

    itemEffect.classList.remove(
        "active"
    );

    void itemEffect.offsetWidth;

    itemEffect.classList.add(
        "active"
    );

    updateCapture();

    showMessage(
        `${username} USED AN ITEM`
    );

}


/* =========================================================
   CATCH
========================================================= */

function catchPokemon(
    username
){

    if(
        !roundActive
        ||
        processingCatch
    ){

        return;

    }

    processingCatch =
        true;

    highlight(
        "catchButton"
    );

    const chance =
        getCaptureChance();

    const roll =
        Math.random() *
        100;

    roundActive =
        false;

    clearInterval(
        timerInterval
    );

    playCaptureAnimation();

    setTimeout(
        ()=>{

            if(
                roll <= chance
            ){

                successfulCapture(
                    username
                );

            }
            else{

                failedCapture(
                    username
                );

            }

        },
        900
    );

}


/* =========================================================
   CAPTURE ANIMATION
========================================================= */

function playCaptureAnimation(){

    captureFlash.classList.remove(
        "active"
    );

    void captureFlash.offsetWidth;

    captureFlash.classList.add(
        "active"
    );

    pokeball.classList.remove(
        "throw"
    );

    void pokeball.offsetWidth;

    pokeball.classList.add(
        "throw"
    );

    pokemonSprite.classList.add(
        "captured"
    );

}


/* =========================================================
   SUCCESS
========================================================= */

function successfulCapture(
    username
){

    const name =
        formatPokemonName(
            currentPokemon.name
        );

    addCapture(
        username
    );

    showMessage(
        `${username} CAUGHT ${name}!`
    );

    setTimeout(
        ()=>{

            pokeball.classList.remove(
                "throw"
            );

            pokemonSprite.classList.remove(
                "captured"
            );

            newPokemon();

        },
        1500
    );

}


/* =========================================================
   FAIL
========================================================= */

function failedCapture(
    username
){

    const name =
        formatPokemonName(
            currentPokemon.name
        );

    showMessage(
        `${name} ESCAPED!`
    );

    pokemonSprite.classList.remove(
        "captured"
    );

    pokemonSprite.classList.add(
        "escape"
    );

    setTimeout(
        ()=>{

            pokeball.classList.remove(
                "throw"
            );

            pokemonSprite.classList.remove(
                "escape"
            );

            newPokemon();

        },
        1500
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );

    timeLeft =
        ROUND_TIME;

    updateTimer();

    timerInterval =
        setInterval(
            ()=>{

                if(
                    !roundActive
                ){

                    return;

                }

                timeLeft -=
                    .1;

                if(
                    timeLeft <= 0
                ){

                    timeLeft =
                        0;

                    updateTimer();

                    escapePokemon();

                    return;

                }

                updateTimer();

            },
            100
        );

}


function updateTimer(){

    timer.textContent =
        `${timeLeft.toFixed(
            1
        )}s`;

    if(
        timeLeft <= 5
    ){

        timer.classList.add(
            "warning"
        );

    }
    else{

        timer.classList.remove(
            "warning"
        );

    }

}


function escapePokemon(){

    if(
        !roundActive
    ){

        return;

    }

    roundActive =
        false;

    clearInterval(
        timerInterval
    );

    pokemonSprite.classList.add(
        "escape"
    );

    showMessage(
        `${formatPokemonName(
            currentPokemon.name
        )} ESCAPED!`
    );

    setTimeout(
        ()=>{

            pokemonSprite.classList.remove(
                "escape"
            );

            newPokemon();

        },
        1300
    );

}


/* =========================================================
   BUTTON HIGHLIGHT
========================================================= */

function highlight(
    id
){

    const element =
        document.getElementById(
            id
        );

    element.classList.add(
        "active"
    );

    setTimeout(
        ()=>{

            element.classList.remove(
                "active"
            );

        },
        500
    );

}


/* =========================================================
   TWITCH
========================================================= */

let twitchClient =
    null;


function connectTwitch(){

    console.log(
        "Connecting to Twitch:",
        CHANNEL
    );

    connectionStatus.textContent =
        "CONECTANDO TWITCH...";

    twitchClient =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:20000
            },

            channels:[
                CHANNEL
            ]

        });


    twitchClient.on(
        "connecting",
        ()=>{

            connectionStatus.textContent =
                "CONECTANDO TWITCH...";

        }
    );


    twitchClient.on(
        "connected",
        ()=>{

            connectionStatus.textContent =
                `TWITCH: ${
                    CHANNEL.toUpperCase()
                }`;

            connectionStatus.classList.add(
                "connected"
            );

        }
    );


    twitchClient.on(
        "reconnect",
        ()=>{

            connectionStatus.textContent =
                "RECONECTANDO...";

        }
    );


    twitchClient.on(
        "disconnected",
        ()=>{

            connectionStatus.textContent =
                "TWITCH DESCONECTADO";

            connectionStatus.classList.remove(
                "connected"
            );

        }
    );


    twitchClient.on(
        "message",
        (
            channel,
            tags,
            msg,
            self
        )=>{

            if(
                self
            ){

                return;

            }

            const username =
                tags["display-name"]
                ||
                tags.username
                ||
                "Twitch";

            addChat(
                username,
                msg
            );

            processCommand(
                username,
                msg
            );

        }
    );


    twitchClient
        .connect()
        .then(
            ()=>{

                console.log(
                    "Twitch connected"
                );

            }
        )
        .catch(
            error=>{

                console.error(
                    "Twitch error:",
                    error
                );

                connectionStatus.textContent =
                    "ERROR TWITCH";

            }
        );

}


/* =========================================================
   COMMANDS
========================================================= */

function processCommand(
    username,
    text
){

    const command =
        text
            .trim()
            .toLowerCase()
            .split(
                /\s+/
            )[0];


    switch(
        command
    ){

        case "!fight":
        case "!f":

            fight(
                username
            );

            break;


        case "!catch":
        case "!c":

            catchPokemon(
                username
            );

            break;


        case "!item":
        case "!i":
        case "!potion":

            useItem(
                username
            );

            break;

    }

}


/* =========================================================
   START
========================================================= */

function start(){

    updateRanking();

    connectTwitch();

    newPokemon();

}


start();

</script>
